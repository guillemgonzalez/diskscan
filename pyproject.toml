[project]
name = "diskscan-tui"
version = "0.1.0"
description = "Terminal UI to find Python virtualenvs and node_modules folders, see how much disk they use, and clean them up."
readme = "README.md"
authors = [
    { name = "Guillem Gonzalez", email = "49951286+guillemgonzalez@users.noreply.github.com" }
]
requires-python = ">=3.13"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["disk-usage", "node_modules", "virtualenv", "venv", "cleanup", "tui", "textual"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
diskscan = "diskscan:main"

[project.urls]
Homepage = "https://github.com/guillemgonzalez/diskscan"
Issues = "https://github.com/guillemgonzalez/diskscan/issues"

[tool.uv.build-backend]
module-name = "diskscan"

[build-system]
requires = ["uv_build>=0.9.27,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
